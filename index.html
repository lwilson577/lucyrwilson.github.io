<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light">
  <title>Lucy Wilson</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="page">

    <!-- NAV -->
<header class="nav">
  <div class="nav-container">

    <nav class="nav-links">
      <a href="#about">About</a>
      <a href="#projects">Projects</a>
      <a href="#contact">Contact</a>
    </nav>

  </div>
</header>

    <!-- HERO -->
<section class="hero">
  <div class="hero-card">

    <h1><span id="typing-text"></span></h1>
    <p class="subtitle">BSc Computer Science Student at Queen's University Belfast</p>
    <p class="description">IT Support Analyst</p>

    <div class="hero-buttons">
      <a href="#projects" class="btn primary">Projects</a>
      <a href="#contact" class="btn secondary">Contact</a>
    </div>

  </div>
</section>

    <!-- ABOUT -->
<section id="about" class="section">
  <div class="card">

    <h2>About</h2>
    <p>BSc Computer Science Student at Queen's University Belfast</p>

    <a href="#" class="btn primary">Learn More</a>

  </div>
</section>

    <!-- PROJECTS -->
<!-- PROJECTS -->
<section id="projects" class="section">
  <div class="card">

    <h2>Projects</h2>
    <p>Some things I've been working on.</p>

    <a href="#" class="btn primary">View Projects</a>

  </div>
</section>

<script>
  const text = "Hi, I'm Lucy Wilson";
  const speed = 60; // typing speed (lower = faster)

  let i = 0;
  const target = document.getElementById("typing-text");

  function typeWriter() {
    if (i < text.length) {
      target.innerHTML += text.charAt(i);
      i++;
      setTimeout(typeWriter, speed);
    }
  }

  window.onload = typeWriter;
</script>

</body>
</html>
